<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>高考倒计时</title>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{--accent:#1FCCCD;--fg:#111;--muted:#5b6b6b;--bg:#fff;--pad:clamp(16px,4.5vw,32px)}
        @media (prefers-color-scheme:dark){:root{--fg:#eaf7f7;--muted:#93a3a3;--bg:#0d1112}}
        html{-webkit-text-size-adjust:100%}
        body{min-height:100dvh;display:grid;place-items:center;padding:clamp(12px,4vw,32px);background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif;line-height:1.4;transition:background-color .3s,color .3s}
        .card{width:min(100%,640px);border:1px solid var(--accent);padding:var(--pad)}
        .label{font-size:clamp(12px,2.6vw,15px);font-weight:700;color:var(--accent);letter-spacing:.08em}
        .sub{margin-top:.4em;font-size:clamp(10px,2.2vw,13px);color:var(--muted);font-weight:500}
        .countdown{margin-top:clamp(14px,4vw,26px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(4px,1.5vw,14px)}
        .unit{display:flex;flex-direction:column;align-items:center;min-width:0;padding:clamp(6px,1.6vw,12px) 2px}
        .num{font-size:clamp(24px,8.5vw,58px);font-weight:700;color:var(--accent);line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
        .unit-label{margin-top:clamp(4px,1.2vw,10px);font-size:clamp(9px,2vw,12px);color:var(--muted);font-weight:600;letter-spacing:.06em}
        @media (max-width:320px){.countdown{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:14px}.num{font-size:clamp(30px,14vw,44px)}}
        @media (prefers-reduced-motion:no-preference){.is-done .num{animation:breathe 1.8s ease-in-out infinite}}
        @keyframes breathe{50%{opacity:.45}}
    </style>
</head>
<body>
<main class="card">
    <h1 class="label">高考倒计时</h1>
    <p class="sub" id="hint">距离高考还有</p>
    <div class="countdown" role="timer" aria-live="off">
        <div class="unit"><span class="num" id="d">---</span><span class="unit-label">天</span></div>
        <div class="unit"><span class="num" id="h">--</span><span class="unit-label">时</span></div>
        <div class="unit"><span class="num" id="m">--</span><span class="unit-label">分</span></div>
        <div class="unit"><span class="num" id="s">--</span><span class="unit-label">秒</span></div>
    </div>
</main>
<script>
    (()=>{const T=new Date(2029,5,7,0,0,0,0).getTime(),D=86400,H=3600,M=60,
        e={d:document.getElementById('d'),h:document.getElementById('h'),m:document.getElementById('m'),s:document.getElementById('s'),hint:document.getElementById('hint'),card:document.querySelector('.card')},
        p=(n,l)=>String(n).padStart(l,'0'),st=(el,t)=>{if(el.textContent!==t)el.textContent=t};
        let raf=null,last=-1,fin=false;
        function rnd(t){st(e.d,p(Math.floor(t/D),3));st(e.h,p(Math.floor(t%D/H),2));st(e.m,p(Math.floor(t%H/M),2));st(e.s,p(t%M,2))}
        function stop(){if(raf!==null){cancelAnimationFrame(raf);raf=null}}
        function fini(){if(fin)return;fin=true;stop();last=0;rnd(0);st(e.hint,'高考已开始，加油！');e.card.classList.add('is-done')}
        function frame(){const r=T-Date.now();if(r<=0){fini();return}const s=Math.floor(r/1000);if(s!==last){last=s;rnd(s)}raf=requestAnimationFrame(frame)}
        function start(){if(fin)return;stop();last=-1;raf=requestAnimationFrame(frame)}
        document.addEventListener('visibilitychange',()=>{if(!document.hidden)start()});
        start()})();
</script>
</body>
</html>

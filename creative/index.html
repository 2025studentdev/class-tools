<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面开发中</title>
    <style>
        /* 页面基础样式重置，确保纯白背景 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #FFFFFF; /* 强制纯白背景 */
            overflow: hidden; /* 防止出现滚动条 */
        }

        /* 居中布局 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 打字机文字样式 */
        #typewriter {
            /* 字体设置 */
            font-family: 'Courier New', Courier, monospace; /* 使用等宽字体，打字机效果更逼真 */
            font-size: 48px; /* 字体大小，可根据需要调整 */
            font-weight: bold;

            /* 颜色设置（纯色系，无描边） */
            color: #1FCCCD; /* 指定的字体颜色 */
        }
    </style>
</head>
<body>

<!-- 用于承载打字机文字的容器 -->
<div id="typewriter"></div>

<script>
    // 需要打出的文字内容
    const text = "该页面开发中";

    // 获取显示文字的 DOM 元素
    const typewriterElement = document.getElementById('typewriter');

    // 当前正在打的字的索引
    let index = 0;

    // 打字的速度（毫秒），数值越小速度越快
    const speed = 200;

    // 核心打字机函数
    function type() {
        // 如果当前索引小于文本长度，说明还没打完
        if (index < text.length) {
            // 将当前索引对应的字符添加到页面中
            typewriterElement.innerHTML += text.charAt(index);
            // 索引加1，准备打下一个字
            index++;
            // 使用 setTimeout 递归调用，形成逐字打印的延迟效果
            setTimeout(type, speed);
        }
        // 当文字全部打完后，不再有后续操作（光标自动消失，不闪烁）
    }

    // 当页面完全加载后，开始执行打字效果
    window.onload = type;
</script>

</body>
</html>
